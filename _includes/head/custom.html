<!-- start custom head snippets -->

<!-- Theme: apply saved / system preference before paint (no flash) + toggle handler -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
    } catch (e) {}
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.theme-toggle');
      if (!btn) return;
      var goDark = document.documentElement.getAttribute('data-theme') !== 'dark';
      if (goDark) document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('theme', goDark ? 'dark' : 'light'); } catch (e) {}
    });
  })();
</script>

<style>
  .theme-toggle { -webkit-appearance: none; appearance: none; background: transparent; border: 0; color: inherit;
    cursor: pointer; padding: 6px; margin: 0; line-height: 0; border-radius: 8px; opacity: 0.68;
    transition: opacity 0.15s ease, background 0.15s ease; display: inline-flex; align-items: center; vertical-align: middle; }
  .theme-toggle:hover { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }
  .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .theme-toggle .i-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .i-sun { display: block; }
  html[data-theme="dark"] .theme-toggle .i-moon { display: none; }
  /* toggle inside the interior (academicpages) masthead */
  .masthead__inner-wrap { position: relative; }
  .masthead .theme-toggle { position: absolute; top: 50%; right: 1em; transform: translateY(-50%); z-index: 11; color: var(--global-masthead-link-color); }
  @media (max-width: 600px) { .masthead .theme-toggle { display: none; } }
  /* dark-mode fix for the masthead's hardcoded white background */
  html[data-theme="dark"] .masthead { background: rgba(15, 23, 42, 0.85); border-bottom-color: rgba(148, 163, 184, 0.14); box-shadow: none; }

  /* ---- propagate homepage aesthetic to interior pages ---- */
  :root { --site-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --global-link-color: #0891b2; --global-link-color-hover: #0e7490; --global-link-color-visited: #0e7490;
    --global-masthead-link-color-hover: #0891b2; }
  html[data-theme="dark"] { --global-link-color: #22d3ee; --global-link-color-hover: #67e8f9; --global-link-color-visited: #67e8f9;
    --global-masthead-link-color-hover: #22d3ee; }
  /* interior header: mono + lowercase, matching the homepage nav */
  .masthead__menu-item a { font-family: var(--site-mono); font-size: 0.82rem; letter-spacing: 0; }
  .masthead__menu-item--lg a { font-family: var(--site-mono); font-weight: 600; font-size: 0.98rem; }
  .masthead .brand-dot { color: #0891b2; }
  html[data-theme="dark"] .masthead .brand-dot { color: #22d3ee; }
</style>
